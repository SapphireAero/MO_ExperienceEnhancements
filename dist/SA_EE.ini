; SA_EE - Mental Omega 3.3.6

[Features]
WeaponRange=1         ; 单选己方单位并按住 Ctrl 显示射程圈
WeaponRangeAAZ=0      ; 对空圈抬高量，单位为 leptons，0 为贴地
Observer=1            ; 修复联机多人观战面板
BuildQueue=1	; 建筑排队 (1=建筑可连点排队, 图标显示待建数, Shift+左键一次5个; 待放置时下一个先等着, 放下后自动开工; 0=原版行为)
AirWay=1		; 飞行器路径点 (1=允许飞机使用路径点, 返航摆头为原版行为; 0=原版行为)
OrderThrottle=1		; 大量单位下令,解除128上限 (0=禁用, 与原版相同; 1=单机直写+联机原版(默认); 2=联机普通令也分帧,规划令仍原版)
WaypointCap=128		; 路径点上限,仅单机生效 (0=单机不限制; N>0=单机上限N, 最大4096; 联机走原版16/128)
TypeSelect=1		; T键建筑全选 (1=按T批量选中同类建筑, 原版仅 1x1 可展开建筑; 0=原版行为)
NoApproach=1		; 无法攻击目标的单位(如维修无人机)不再冲向该敌方目标 (1=停原地忽略该攻击令(默认); 0=原版行为)

[PlaceScatter]
Mode=1		; 0=禁用(原版行为), 1=点下时驱离(晃幽影不碰单位), 2=自动驱离
Interval=30	; Mode=2 补扫间隔 (游戏逻辑帧, 5~300, 默认30)
Batch=16	; 每次触发最多发出的移动事件 (1~64, 默认16)
Dist=2		; 出框后再向外推的格数 (1~4, 默认2)

[RepairAll]
Mode=1			; 0禁用，1=双击维修 或 ctrl+维修，2=自动修
Interval=30		; Mode=2 的扫描间隔 (游戏逻辑帧, 5~600, 默认30≈1秒)。
Batch=24		; 每个逻辑帧最多入队多少条维修事件 (1~96, 默认24)。OutList 一帧上限 128,
DoubleClick=1	; 1=认双击/连按 (图标与快捷键都认), 0=只认 Ctrl+维修。
DblMs=400		; 两下的最大间隔 (毫秒, 默认400)。

[Aggressive]
Hotkey=Alt+A	; 切换选中单位的侵略模式; 标记单位闲置时自动攻击警戒范围内的敌方目标(0=禁用)
IconOffsetX=9	; 标记图标相对单位中心的横向像素偏移
IconOffsetY=-5	; 标记图标相对单位中心的纵向像素偏移 (负=上移)
Interval=30		; 空闲扫描间隔 (游戏逻辑帧, 1~300, 默认15≈0.5秒)
Cooldown=45		; 同一单位两次自动攻击的最小间隔
RangePercent=100; 攻击半径 (半径取 GuardRange 与主/副武器射程中的最大值;10~400, 默认100)
Target=all		; 目标范围: all=所有敌方单位, building=只打敌方建筑

[SmartArea]
Enable=1	; 1=组合中键区域自适应, 0=关闭
Hotkey=Shift+Middle	; 组合键触发 (Shift+中键; 也可改单键如 X1)
Range=3		; 扫描块边长 (格, 2~16, 默认4; 以轨迹各节点为中心由近及远挑目标; )
SquadSize=4	; 几打一 (1~16, 默认4; 同一目标最多几个单位下单, 满则分流下个目标, 与模糊同义; 进驻均分不管此项)

[TreeChop]
Enable=1	; 0=关闭
Hotkey=Ctrl+Z+Middle	; 砍树组合键
Range=6		; 扫描块边长 (格, 2~16, 默认4; 鼠标在块内 [Range/2][Range/2])

[PlacementPreview]
Opacity=25		; 放置建筑时半透明预览 0=关闭, 25/50/75/100 由淡到不透明 (检测到 Phobos 时跳过)

[FrameCap]
Enable=1	; 0=关闭, 1=开启

[Environment]
LightFixEnable=1	; 1=光照修复,光照变更后全格重建+读档/换图后按引擎现值重算光照; 0=全部关闭, 引擎原版;
LightMix=50			; 混色比例,0=不染色(默认遭遇战行为,光照参数不影响单位/建筑/玩家色), 100=完全按光照参数染色,战役触发行为;
OreEnable=1		; 1=启用矿石光照系数, 0=完全引擎原版;
OreFactor=75	; 矿石/宝石受环境光照影响的百分比,0=原版(夜里全亮不受光照),100=完全遵循环境光照;

[Log]
MaxKB=500		; 启动时超过该大小(KB)就清空一次再写; <=0=不限;
Perf=0			; 0=关; 1=全量分段耗时账 (us/帧); 2=只记帧率 (几乎零开销)

[DisplayFix]
SmallMapCenter=1
TooltipClamp=1

[PowerDisplay]
Enable=1            ; 侧栏底部显示电力
Mode=0              ; 0=用电/总电量，1=电力余量
X=0                 ; 0=侧栏内居中，正数=侧栏内横坐标
Pad=6               ; 距侧栏底边的像素
FontPx=16           ; 0=随原生字号
FontFace=msyh.ttc
Bold=0

[ChatBox]
Enable=1            ; 聊天输入框和输入法候选窗定位
SinglePlayer=0      ; 1=单机也可打开聊天输入框
FontPx=18
FontFace=msyh.ttc
Bold=0
ImeFullscreen=-1    ; -1=自动，0=按窗口，1=按全屏
QuickText=          ; 可填手动短语，用字面的 \n 分隔。上下键选择，回车发送

[UnitPanel]
Enable=1            ; 左下角选中信息
FontPx=13
FontFace=msyh.ttc
BottomMargin=35

[Beacon]
AutoReplace=1       ; 联机放第 4 个信标时复用最旧的一个槽位
Arrows=1            ; 仅指向在画面外且本机可见的信标
ArrowInset=16
ArrowSize=11
